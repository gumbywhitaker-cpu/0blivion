name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: kiwiflow

env:
  DATABASE_URL: "file:./dev.db"
  AUTH_SECRET: "ci-only-not-a-real-secret-do-not-use-in-production"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kiwiflow/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations (sqlite, CI-local)
        run: npx prisma migrate deploy

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Generate Next.js route types
        # tsc alone can't see LayoutProps/PageProps -- those are ambient
        # types Next.js writes to .next/types, normally produced as a side
        # effect of `next dev`/`next build`. `next typegen` does just that
        # without a full build, so a fresh checkout typechecks correctly.
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Seed demo data
        run: npm run db:seed

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: kiwiflow/playwright-report/
          retention-days: 14
