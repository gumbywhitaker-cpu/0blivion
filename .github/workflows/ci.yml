name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: kiwiflow

env:
  DATABASE_URL: "file:./dev.db"
  AUTH_SECRET: "ci-only-not-a-real-secret-do-not-use-in-production"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kiwiflow/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Apply migrations (sqlite, CI-local)
        run: npx prisma migrate deploy

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
