name: Build Windows desktop app

# Manual only: this is a slow (Electron download + native module compile),
# infrequently-needed build, not something that should run on every push and
# compete with the fast CI feedback loop in ci.yml. Trigger from the Actions
# tab (or the API) when a real Windows .exe is actually needed.
on:
  workflow_dispatch: {}

jobs:
  build:
    # Must run on real Windows: better-sqlite3's native binary has to be
    # compiled on the same OS/arch it will run on, and Windows-native
    # compilation isn't reliably cross-buildable from Linux/macOS.
    #
    # Pinned to windows-2022, not windows-latest: a real run against
    # windows-latest (2026-08-23) failed npm ci itself, before this
    # workflow's own steps even started, because that label had rolled
    # onto a newer "windows-2025-vs2026" preview image whose Visual
    # Studio reports a version string node-gyp's detector doesn't
    # recognize ("could not find a version of Visual Studio 2017 or
    # newer" despite VS actually being installed) -- better-sqlite3 had
    # no prebuilt binary for this combination and fell back to
    # compiling from source. windows-2022 has a well-established VS2022
    # toolchain node-gyp reliably detects.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kiwiflow/package-lock.json

      - name: Install app dependencies
        working-directory: kiwiflow
        run: npm ci

      - name: Build the Next.js app (standalone output)
        working-directory: kiwiflow
        env:
          DATABASE_URL: "file:./ci-build-only.db"
          AUTH_SECRET: "ci-build-only-not-a-real-secret"
          NEXT_PUBLIC_APP_URL: "http://127.0.0.1:0"
          # next.config.ts reads this at build time (Next bakes computed
          # headers into the standalone build's manifest, not re-evaluated
          # at server start) to drop the HTTPS-upgrade headers that don't
          # make sense for a loopback-only Electron window -- see the
          # isDesktop comment there.
          KIWIFLOW_DESKTOP: "1"
        run: |
          npx prisma generate
          npm run build

      - name: Install desktop packaging dependencies
        working-directory: kiwiflow/desktop
        run: npm ci

      - name: Assemble app resources
        working-directory: kiwiflow/desktop
        run: node build.js

      - name: Rebuild native modules for Electron
        working-directory: kiwiflow/desktop
        run: node rebuild-native.js

      - name: Build the Windows installer
        working-directory: kiwiflow/desktop
        env:
          # No code-signing certificate exists for this project (see
          # docs/DESKTOP_APP.md) -- tell electron-builder not to go looking
          # for one on the runner, rather than fail or silently skip signing.
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win

      - uses: actions/upload-artifact@v4
        with:
          name: kiwiflow-windows-installer
          path: kiwiflow/desktop/dist/*.exe
          retention-days: 30
